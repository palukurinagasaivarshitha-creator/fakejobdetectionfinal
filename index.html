<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriJob AI - Fake Job Posting Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f293d;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.12);
      --accent-red: #ef4444;
      --accent-red-bg: rgba(239, 68, 68, 0.12);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --input-bg: #1a2234;
      --input-border: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #172554, #0b0f19 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container { width: 100%; max-width: 820px; }
    header { text-align: center; margin-bottom: 2rem; }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9999px;
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle { color: var(--text-muted); font-size: 1.05rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      margin-bottom: 2rem;
    }

    .presets-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--card-border);
    }

    .preset-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }
    .preset-chip {
      background: #1f293d;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-chip:hover { background: #374151; color: #fff; }

    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #d1d5db; }

    input[type="text"], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    textarea { resize: vertical; min-height: 140px; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-submit:hover:not(:disabled) { background: #1d4ed8; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result Panel Styling */
    .result-card {
      display: none;
      border-radius: 14px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.real {
      background: var(--accent-green-bg);
      border: 1.5px solid rgba(16, 185, 129, 0.4);
    }

    .result-card.fake {
      background: var(--accent-red-bg);
      border: 1.5px solid rgba(239, 68, 68, 0.4);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .badge.real { background: var(--accent-green); color: #064e3b; }
    .badge.fake { background: var(--accent-red); color: #ffffff; }

    .result-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.35rem; }
    .result-title.real { color: #34d399; }
    .result-title.fake { color: #fca5a5; }

    .result-desc { font-size: 0.98rem; font-weight: 600; line-height: 1.5; }
    .result-desc.real { color: #10b981; }
    .result-desc.fake { color: #ef4444; }

    /* Dynamic Careers Button */
    .btn-careers {
      margin-top: 1.25rem;
      background: var(--accent-green);
      color: #064e3b;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-careers:hover {
      background: #34d399;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    footer { text-align: center; color: var(--text-muted); font-size: 0.82rem; margin-top: auto; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-badge">Verification Gatekeeper</div>
      <h1>Fake Job Posting Detector</h1>
      <p class="subtitle">Instant career verification with multi-gate recruitment fraud protection.</p>
    </header>

    <div class="card">
      <!-- Quick Test Presets -->
      <div class="presets-container">
        <span class="preset-label">Quick Test Presets:</span>
        <button type="button" class="preset-chip" onclick="loadRealSample()">Valid Job (Real)</button>
        <button type="button" class="preset-chip" onclick="loadScamSample()">Wire Transfer Scam (Fake)</button>
        <button type="button" class="preset-chip" onclick="loadShortSample()">"Varshitha" (Short Name)</button>
        <button type="button" class="preset-chip" onclick="loadNoKeywordsSample()">Random Text (No Keywords)</button>
      </div>

      <form id="jobForm" onsubmit="handleJobCheck(event)">
        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="e.g., Google" required autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="jobDescription">Job Description &amp; Requirements</label>
          <textarea id="jobDescription" placeholder="Paste full job posting details here..." required></textarea>
        </div>

        <button type="submit" id="checkJobBtn" class="btn-submit">
          <span id="btnText">Check Job</span>
          <div id="btnSpinner" class="spinner"></div>
        </button>
      </form>

      <!-- Prediction Result Panel -->
      <div id="resultCard" class="result-card">
        <div class="result-header">
          <span id="statusBadge" class="badge"></span>
        </div>
        <h3 id="resultHeading" class="result-title"></h3>
        <p id="resultReason" class="result-desc"></p>
        <div id="resultActionContainer"></div>
      </div>
    </div>

    <footer>AI-Powered Verification &bull; Multi-Gate Fraud Safeguards</footer>
  </div>

  <script>
    function loadRealSample() {
      document.getElementById("companyName").value = "Google";
      document.getElementById("jobDescription").value = 
        "We are a growing digital software engineering team working with top clients and companies worldwide.\n\n" +
        "Our web platform team is looking for a Senior Software Engineer for a full-time role.\n" +
        "You will collaborate with clients and engineers to design, build, and deploy modern scalable software services.\n\n" +
        "Role & Qualifications:\n" +
        "- 5+ years of software development experience with Python, Go, or Java.\n" +
        "- Strong skills in cloud computing, microservices architecture, and SQL databases.\n" +
        "- Bachelor or Master degree in Computer Science or related technical discipline.\n\n" +
        "We offer competitive salary, full-time benefits, health insurance, and retirement plans.\n" +
        "Interested candidates are encouraged to apply by submitting your resume today.";
      clearResult();
    }

    function loadScamSample() {
      document.getElementById("companyName").value = "Global Wealth Ventures LLC";
      document.getElementById("jobDescription").value = 
        "URGENT: Work from home data entry position! Earn $4,500 weekly with no interview required!\n\n" +
        "Must have an active bank account for payroll processing and equipment deposit checks. " +
        "You will be receiving financial transfers and wiring funds via Western Union to purchase company hardware. " +
        "Send your resume, bank routing number, and copy of passport immediately to careers-dept992@gmail.com.";
      clearResult();
    }

    function loadShortSample() {
      document.getElementById("companyName").value = "Varshitha";
      document.getElementById("jobDescription").value = "";
      clearResult();
    }

    function loadNoKeywordsSample() {
      document.getElementById("companyName").value = "Acme Corp";
      document.getElementById("jobDescription").value = 
        "We had pizza and watched movies at our brand new campus building yesterday afternoon with everyone and had a lot of fun together.";
      clearResult();
    }

    function clearResult() {
      const card = document.getElementById("resultCard");
      card.style.display = "none";
      const actionContainer = document.getElementById("resultActionContainer");
      if (actionContainer) actionContainer.innerHTML = "";
    }

    // =========================================================================
    // JAVASCRIPT FETCH & DIRECT REDIRECT LOGIC
    // =========================================================================
    async function handleJobCheck(event) {
      event.preventDefault();

      const companyInput = document.getElementById("companyName");
      const descInput = document.getElementById("jobDescription");
      const companyName = companyInput.value.trim();
      const jobDescription = descInput.value.trim();

      const btn = document.getElementById("checkJobBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const resultCard = document.getElementById("resultCard");
      const statusBadge = document.getElementById("statusBadge");
      const resultHeading = document.getElementById("resultHeading");
      const resultReason = document.getElementById("resultReason");
      const actionContainer = document.getElementById("resultActionContainer");

      if (!companyName && !jobDescription) {
        alert("Please enter a company name or job description.");
        return;
      }

      // Reset previous results
      btn.disabled = true;
      btnText.textContent = "Checking...";
      btnSpinner.style.display = "block";
      resultCard.style.display = "none";
      actionContainer.innerHTML = "";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            company_name: companyName,
            job_description: jobDescription
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();
        resultCard.style.display = "block";

        if (data.prediction === "Real") {
          // -----------------------------------------------------------------
          // 1. Display Result First (Green "Real" Text, NO automatic redirect)
          // -----------------------------------------------------------------
          resultCard.className = "result-card real";
          statusBadge.className = "badge real";
          statusBadge.textContent = "Real";
          resultHeading.className = "result-title real";
          resultHeading.textContent = "Real";
          resultReason.className = "result-desc real";
          resultReason.textContent = data.reason || "Verified as an authentic job posting.";

          // -----------------------------------------------------------------
          // 2. Add Dynamic Redirect Button (Direct Website Redirect)
          // -----------------------------------------------------------------
          const careersBtn = document.createElement("button");
          careersBtn.type = "button";
          careersBtn.className = "btn-careers";
          careersBtn.textContent = "Go to Official Careers Page →";

          // Direct website redirect bypassing Google Notice
          careersBtn.onclick = function() {
            const cleanCompany = (data.company_name || companyName).replace(/\s+/g, '').toLowerCase();
            window.location.href = "https://www." + cleanCompany + ".com/careers";
          };

          actionContainer.appendChild(careersBtn);

        } else {
          // -----------------------------------------------------------------
          // 3. Fake Handling: Show Red "Fake" Text and Reason (No Button)
          // -----------------------------------------------------------------
          resultCard.className = "result-card fake";
          statusBadge.className = "badge fake";
          statusBadge.textContent = "Fake";
          resultHeading.className = "result-title fake";
          resultHeading.textContent = "Fake";
          resultReason.className = "result-desc fake";
          resultReason.textContent = data.reason || "This job posting has been flagged as Fake.";

          // Ensure redirect button is completely removed
          actionContainer.innerHTML = "";
        }

      } catch (err) {
        console.error("Prediction error:", err);
        resultCard.style.display = "block";
        resultCard.className = "result-card fake";
        statusBadge.className = "badge fake";
        statusBadge.textContent = "Fake";
        resultHeading.className = "result-title fake";
        resultHeading.textContent = "Error";
        resultReason.className = "result-desc fake";
        resultReason.textContent = "Could not communicate with detection server. Please ensure backend is running.";
        actionContainer.innerHTML = "";
      } finally {
        btn.disabled = false;
        btnText.textContent = "Check Job";
        btnSpinner.style.display = "none";
      }
    }
  </script>
</body>
</html>
